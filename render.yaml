services:
  - type: web
    name: ledgerline
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: ledgerline-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: llama3.1
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: CHROMA_DB_DIR
        value: /app/data/chroma_db
      - key: KPI_DATABASE_PATH
        value: /app/data/financial_metrics.db
      - key: MAX_UPLOAD_MB
        value: "50"
