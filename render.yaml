services:
  - type: web
    name: ledgerline
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: llama3.1
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: MAX_UPLOAD_MB
        value: "50"
